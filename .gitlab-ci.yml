stages:
  - build
  - test
  - deploy

image: node:20

# Etapa 1: Construcción
build_frontend:
  stage: build
  script:
    - echo "Instalando dependencias del Frontend..."
    - npm install
    - echo "Construyendo la aplicación para producción..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Etapa 2: Análisis de Calidad
test_code_quality:
  stage: test
  script:
    - echo "Ejecutando análisis de código estático (Lint)..."
    - npm install
    - npm run lint
  allow_failure: false

# Etapa 3: Despliegue Automático
deploy_to_aws:
  stage: deploy
  image: debian:bullseye-slim
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install -y openssh-client )' 
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - if [ -f "$AWS_SSH_KEY" ]; then cp "$AWS_SSH_KEY" ~/.ssh/id_rsa; else echo "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa; fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan $AWS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Conectando al servidor AWS EC2 para desplegar..."
    - ssh $AWS_USERNAME@$AWS_HOST "cd ~/proyecto-seguridad/frontend && git pull origin main && cd .. && docker compose up -d --build frontend"
  only:
    - main
