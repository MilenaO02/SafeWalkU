stages:
  - build
  - test
  - deploy

image: node:20

# Etapa 1: Construcción
build_frontend:
  stage: build
  script:
    - echo "Instalando dependencias del Frontend..."
    - npm install
    - echo "Construyendo la aplicación para producción..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Etapa 2: Análisis de Calidad
test_code_quality:
  stage: test
  script:
    - echo "Ejecutando análisis de código estático (Lint)..."
    - npm install
    - npm run lint
  allow_failure: false

# Etapa 3: Despliegue Automático
deploy_to_aws:
  stage: deploy
  image: debian:bullseye-slim
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install -y openssh-client )' 
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - if [ -f "$AWS_SSH_KEY" ]; then cp "$AWS_SSH_KEY" ~/.ssh/id_rsa; else echo "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa; fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan $AWS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Empaquetando y copiando archivos al servidor AWS EC2..."
    - tar -czf /tmp/deploy.tar.gz .
    - ssh $AWS_USERNAME@$AWS_HOST "mkdir -p ~/safewalku2"
    - scp /tmp/deploy.tar.gz $AWS_USERNAME@$AWS_HOST:~/safewalku2/deploy.tar.gz
    - echo "Instalando Docker en AWS si no existe y desplegando..."
    - ssh $AWS_USERNAME@$AWS_HOST "if ! command -v docker &> /dev/null; then curl -fsSL https://get.docker.com -o get-docker.sh && sudo sh get-docker.sh; fi"
    - ssh $AWS_USERNAME@$AWS_HOST "cd ~/safewalku2 && tar -xzf deploy.tar.gz && rm deploy.tar.gz && sudo docker build -t safewalkweb . && sudo docker stop safewalkweb_container || true && sudo docker rm safewalkweb_container || true && sudo docker run -d --name safewalkweb_container -p 80:80 safewalkweb"
  only:
    - main
