stages:
  - build
  - test
  - deploy

image: node:20

# Etapa 1: Construcción
build_frontend:
  stage: build
  script:
    - echo "Instalando dependencias del Frontend..."
    - npm install
    - echo "Construyendo la aplicación para producción..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# Etapa 2: Análisis de Calidad
test_code_quality:
  stage: test
  script:
    - echo "Ejecutando análisis de código estático (Lint)..."
    - npm install
    - npm run lint
  allow_failure: false

# Etapa 3: Despliegue Automático
deploy_to_aws:
  stage: deploy
  image: debian:bullseye-slim
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install -y openssh-client )' 
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - if [ -f "$AWS_SSH_KEY" ]; then cp "$AWS_SSH_KEY" ~/.ssh/id_rsa; else echo "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa; fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan $AWS_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Empaquetando artefactos (dist/) para enviar a AWS..."
    - tar -czf /tmp/deploy.tar.gz dist/ nginx.conf
    - ssh $AWS_USERNAME@$AWS_HOST "mkdir -p ~/safewalku2"
    - scp /tmp/deploy.tar.gz $AWS_USERNAME@$AWS_HOST:~/safewalku2/deploy.tar.gz
    - echo "Instalando dependencias (Docker y Certbot) en AWS si no existen..."
    - ssh $AWS_USERNAME@$AWS_HOST "if ! command -v docker &> /dev/null; then curl -fsSL https://get.docker.com -o get-docker.sh && sudo sh get-docker.sh; fi"
    - ssh $AWS_USERNAME@$AWS_HOST "if ! command -v certbot &> /dev/null; then sudo apt-get update -y && sudo apt-get install -y certbot; fi"
    - echo "Generando Certificado SSL Seguro y Desplegando..."
    - ssh $AWS_USERNAME@$AWS_HOST "cd ~/safewalku2 && tar -xzf deploy.tar.gz && rm deploy.tar.gz && sudo systemctl stop apache2 2>/dev/null || true && sudo systemctl stop nginx 2>/dev/null || true && sudo docker rm -f \$(sudo docker ps -q --filter 'publish=80') 2>/dev/null || true && sudo docker rm -f safewalkweb_container 2>/dev/null || true"
    - ssh $AWS_USERNAME@$AWS_HOST "sudo certbot certonly --standalone -d safewalku.online -d www.safewalku.online -m admin@uide.edu.ec --agree-tos -n || true"
    - ssh $AWS_USERNAME@$AWS_HOST "sudo cp /etc/letsencrypt/live/safewalku.online/fullchain.pem /tmp/cert.pem || true && sudo cp /etc/letsencrypt/live/safewalku.online/privkey.pem /tmp/key.pem || true"
    - ssh $AWS_USERNAME@$AWS_HOST "sudo docker run -d --name safewalkweb_container -p 80:80 -p 443:443 -v ~/safewalku2/dist:/usr/share/nginx/html -v ~/safewalku2/nginx.conf:/etc/nginx/conf.d/default.conf -v /tmp/cert.pem:/etc/nginx/cert.pem -v /tmp/key.pem:/etc/nginx/key.pem nginx:alpine"
  only:
    - main
