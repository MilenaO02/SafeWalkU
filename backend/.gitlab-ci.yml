stages:
  - build
  - test
  - security
  - deploy

default:
  image: node:20

build_backend:
  stage: build
  script:
    - echo "Instalando dependencias del backend..."
    - cd backend
    - npm ci
    - echo "Compilando backend TypeScript..."
    - npm run build
    - echo "Preparando dependencias de produccion para no saturar EC2..."
    - npm prune --omit=dev
    - echo "Comprobando archivo compilado..."
    - test -f dist/server.js
  artifacts:
    name: "backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/dist/
      - backend/package.json
      - backend/package-lock.json
      - backend/node_modules/
      - backend/ecosystem.config.cjs
      - backend/scripts/backup-database.mjs
      - backend/scripts/migrate-route-geometry.mjs
      - backend/db/migrations/
    expire_in: 1 hour

test_backend_typescript:
  stage: test
  script:
    - echo "Validando el codigo TypeScript..."
    - cd backend
    - npm ci
    - npm run typecheck
  allow_failure: false

test_backend:
  stage: test
  script:
    - echo "Ejecutando pruebas del backend..."
    - cd backend
    - npm ci
    - npm test
  allow_failure: false

security_backend:
  stage: security
  script:
    - echo "Analizando vulnerabilidades del backend..."
    - cd backend
    - npm ci
    - npm audit --audit-level=high
  allow_failure: true

deploy_backend:
  stage: deploy
  image: debian:bullseye-slim

  needs:
    - job: build_backend
      artifacts: true

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client tar
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$AWS_SSH_KEY" ]; then
        cp "$AWS_SSH_KEY" ~/.ssh/id_rsa
      else
        printf '%s\n' "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - |
      resolve_ci_value() {
        if [ -f "$1" ]; then tr -d '\r\n' < "$1"; else printf '%s' "$1"; fi
      }
      DEPLOY_HOST="$(resolve_ci_value "$AWS_HOST")"
      DEPLOY_USER="$(resolve_ci_value "$AWS_USERNAME")"
      DEPLOY_PORT="${AWS_SSH_PORT:-22}"
      test -n "$DEPLOY_HOST" || { echo "ERROR: AWS_HOST esta vacio" >&2; exit 1; }
      test -n "$DEPLOY_USER" || { echo "ERROR: AWS_USERNAME esta vacio" >&2; exit 1; }
      case "$DEPLOY_HOST" in http://*|https://*|*@*|*/*) echo "ERROR: AWS_HOST debe contener solo IP o hostname, sin protocolo, usuario ni ruta" >&2; exit 1 ;; esac
      cat > ~/.ssh/config <<EOF
      Host safewalk-target
        HostName $DEPLOY_HOST
        User $DEPLOY_USER
        Port $DEPLOY_PORT
        IdentityFile ~/.ssh/id_rsa
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new
        ConnectTimeout 20
        ServerAliveInterval 15
        ServerAliveCountMax 20
      EOF
      chmod 600 ~/.ssh/config
      echo "Comprobando SSH en ${DEPLOY_HOST}:${DEPLOY_PORT}..."
      ssh safewalk-target "echo Conexion SSH correcta"

  script:
    - echo "Empaquetando backend..."
    - tar -czf /tmp/backend.tar.gz backend/dist backend/node_modules backend/package.json backend/package-lock.json backend/ecosystem.config.cjs backend/scripts/backup-database.mjs backend/scripts/migrate-route-geometry.mjs backend/db/migrations

    - echo "Liberando espacio en EC2 antes del despliegue..."
    - |
      ssh safewalk-target '
        set -e
        npm cache clean --force 2>/dev/null || true
        rm -rf ~/.npm/_cacache ~/.cache/npm 2>/dev/null || true
        rm -f ~/safewalku/*.tar.gz ~/backend.tar.gz 2>/dev/null || true
        sudo journalctl --vacuum-size=30M 2>/dev/null || true
        sudo apt-get clean 2>/dev/null || true
        sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
        if command -v docker >/dev/null 2>&1; then
          sudo docker container prune -f || true
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
        fi
        available_kb=$(df --output=avail / | tail -1 | tr -d " ")
        df -h /
        if [ "$available_kb" -lt 307200 ]; then
          echo "ERROR: EC2 necesita al menos 300 MB libres para desplegar; amplie el volumen EBS." >&2
          exit 1
        fi
      '

    - echo "Preparando directorio en EC2..."
    - ssh safewalk-target "mkdir -p ~/safewalku/backend"

    - echo "Enviando backend..."
    - scp /tmp/backend.tar.gz safewalk-target:~/safewalku/backend.tar.gz

    - echo "Extrayendo backend..."
    - |
      ssh safewalk-target '
        set -e
        cd ~/safewalku
        rm -rf backend/dist backend/node_modules
        tar -xzf backend.tar.gz
        rm -f backend.tar.gz
        if [ ! -f backend/.env ] && [ -f .env ]; then
          ln -s ../.env backend/.env
        fi
      '

    - echo "Dependencias de produccion preparadas por GitLab; se omite npm ci en EC2."

    - echo "Creando respaldo obligatorio antes de migrar..."
    - ssh safewalk-target "cd ~/safewalku/backend && npm run backup:before-demo-cleanup"

    - echo "Aplicando migraciones..."
    - ssh safewalk-target "cd ~/safewalku/backend && SAFEWALK_SKIP_LEGACY_MIGRATIONS=1 npm run migrate:routes"

    - echo "Reiniciando backend con PM2..."
    - ssh safewalk-target "cd ~/safewalku/backend && pm2 startOrReload ecosystem.config.cjs --env production --update-env && pm2 save"

    - echo "Verificando el proceso..."
    - ssh safewalk-target 'pm2 status safewalk-backend && test "$(pm2 pid safewalk-backend)" != "0" && curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:3000/api/health'

    - echo "Backend desplegado correctamente."

  environment:
    name: backend-production
    url: https://safewalku.online/api

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
