stages:
  - build
  - test
  - security
  - deploy

default:
  image: node:20

build_backend:
  stage: build
  script:
    - echo "Instalando dependencias del backend..."
    - cd backend
    - npm ci
    - echo "Compilando backend TypeScript..."
    - npm run build
    - echo "Comprobando archivo compilado..."
    - test -f dist/server.js
  artifacts:
    name: "backend-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/dist/
      - backend/package.json
      - backend/package-lock.json
      - backend/scripts/migrate-route-geometry.mjs
      - backend/db/migrations/
    expire_in: 1 hour

test_backend_typescript:
  stage: test
  script:
    - echo "Validando el codigo TypeScript..."
    - cd backend
    - npm ci
    - npm run typecheck
  allow_failure: false

test_backend:
  stage: test
  script:
    - echo "Ejecutando pruebas del backend..."
    - cd backend
    - npm ci
    - npm test
  allow_failure: false

security_backend:
  stage: security
  script:
    - echo "Analizando vulnerabilidades del backend..."
    - cd backend
    - npm ci
    - npm audit --audit-level=high
  allow_failure: true

deploy_backend:
  stage: deploy
  image: debian:bullseye-slim

  needs:
    - job: build_backend
      artifacts: true

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client tar
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$AWS_SSH_KEY" ]; then
        cp "$AWS_SSH_KEY" ~/.ssh/id_rsa
      else
        printf '%s\n' "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - |
      resolve_ci_value() {
        if [ -f "$1" ]; then tr -d '\r\n' < "$1"; else printf '%s' "$1"; fi
      }
      DEPLOY_HOST="$(resolve_ci_value "$AWS_HOST")"
      DEPLOY_USER="$(resolve_ci_value "$AWS_USERNAME")"
      DEPLOY_PORT="${AWS_SSH_PORT:-22}"
      test -n "$DEPLOY_HOST" || { echo "ERROR: AWS_HOST esta vacio" >&2; exit 1; }
      test -n "$DEPLOY_USER" || { echo "ERROR: AWS_USERNAME esta vacio" >&2; exit 1; }
      case "$DEPLOY_HOST" in http://*|https://*|*@*|*/*) echo "ERROR: AWS_HOST debe contener solo IP o hostname, sin protocolo, usuario ni ruta" >&2; exit 1 ;; esac
      cat > ~/.ssh/config <<EOF
      Host safewalk-target
        HostName $DEPLOY_HOST
        User $DEPLOY_USER
        Port $DEPLOY_PORT
        IdentityFile ~/.ssh/id_rsa
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new
        ConnectTimeout 20
        ServerAliveInterval 15
      EOF
      chmod 600 ~/.ssh/config
      echo "Comprobando SSH en ${DEPLOY_HOST}:${DEPLOY_PORT}..."
      ssh safewalk-target "echo Conexion SSH correcta"

  script:
    - echo "Empaquetando backend..."
    - tar -czf /tmp/backend.tar.gz backend/dist backend/package.json backend/package-lock.json backend/scripts/migrate-route-geometry.mjs backend/db/migrations

    - echo "Liberando espacio en EC2 antes del despliegue..."
    - ssh safewalk-target "npm cache clean --force 2>/dev/null || true; rm -rf ~/safewalku/backend/node_modules 2>/dev/null || true; sudo journalctl --vacuum-size=50M 2>/dev/null || true; sudo apt-get clean 2>/dev/null || true; df -h /"

    - echo "Preparando directorio en EC2..."
    - ssh safewalk-target "mkdir -p ~/safewalku/backend"

    - echo "Enviando backend..."
    - scp /tmp/backend.tar.gz safewalk-target:~/safewalku/backend.tar.gz

    - echo "Extrayendo backend..."
    - ssh safewalk-target "cd ~/safewalku && rm -rf backend/dist && tar -xzf backend.tar.gz && rm -f backend.tar.gz"

    - echo "Instalando dependencias de produccion..."
    - ssh safewalk-target "cd ~/safewalku/backend && npm ci --omit=dev"

    - echo "Aplicando migraciones..."
    - ssh safewalk-target "cd ~/safewalku/backend && npm run migrate:routes"

    - echo "Reiniciando backend con PM2..."
    - ssh safewalk-target "cd ~/safewalku/backend && if pm2 describe safewalk-backend > /dev/null 2>&1; then pm2 restart safewalk-backend --update-env; else pm2 start dist/server.js --name safewalk-backend; fi && pm2 save"

    - echo "Verificando el proceso..."
    - ssh safewalk-target "pm2 status safewalk-backend"

    - echo "Backend desplegado correctamente."

  environment:
    name: backend-production
    url: https://safewalku.online/api

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
