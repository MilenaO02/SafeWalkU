services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: safewalku
      MYSQL_USER: ${DB_USER:-safewalk_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safewalk-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-safewalk_user}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD en .env}
      DB_NAME: safewalku
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET en .env}
      JWT_EXPIRES: ${JWT_EXPIRES:-2h}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://safewalku.online,https://www.safewalku.online}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      ROUTING_TIMEOUT_MS: ${ROUTING_TIMEOUT_MS:-8000}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - safewalk-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safewalk-net

volumes:
  mysql_data:
  backend_uploads:

networks:
  safewalk-net:
    driver: bridge
