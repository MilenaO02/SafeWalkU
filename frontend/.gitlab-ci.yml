stages:
  - build
  - test
  - deploy

default:
  image: node:20

build_frontend:
  stage: build
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    name: "frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/dist/
      - safewalku.nginx
    expire_in: 1 hour

test_frontend_quality:
  stage: test
  script:
    - cd frontend
    - npm ci
    - npm run lint
  allow_failure: false

deploy_frontend:
  stage: deploy
  image: debian:bullseye-slim
  needs:
    - job: build_frontend
      artifacts: true
  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client tar curl
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$AWS_SSH_KEY" ]; then
        cp "$AWS_SSH_KEY" ~/.ssh/id_rsa
      else
        printf '%s\n' "$AWS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    - |
      resolve_ci_value() {
        if [ -f "$1" ]; then tr -d '\r\n' < "$1"; else printf '%s' "$1"; fi
      }
      DEPLOY_HOST="$(resolve_ci_value "$AWS_HOST")"
      DEPLOY_USER="$(resolve_ci_value "$AWS_USERNAME")"
      DEPLOY_PORT="${AWS_SSH_PORT:-22}"
      test -n "$DEPLOY_HOST" || { echo "ERROR: AWS_HOST esta vacio" >&2; exit 1; }
      test -n "$DEPLOY_USER" || { echo "ERROR: AWS_USERNAME esta vacio" >&2; exit 1; }
      case "$DEPLOY_HOST" in http://*|https://*|*@*|*/*) echo "ERROR: AWS_HOST debe contener solo IP o hostname" >&2; exit 1 ;; esac
      cat > ~/.ssh/config <<EOF
      Host safewalk-target
        HostName $DEPLOY_HOST
        User $DEPLOY_USER
        Port $DEPLOY_PORT
        IdentityFile ~/.ssh/id_rsa
        IdentitiesOnly yes
        StrictHostKeyChecking accept-new
        ConnectTimeout 20
        ServerAliveInterval 15
        ServerAliveCountMax 20
      EOF
      chmod 600 ~/.ssh/config
      echo "Comprobando SSH en ${DEPLOY_HOST}:${DEPLOY_PORT}..."
      ssh safewalk-target "echo Conexion SSH correcta"
  script:
    - |
      test -n "${VITE_GOOGLE_MAPS_API_KEY:-}" || { echo "ERROR: falta la variable protegida VITE_GOOGLE_MAPS_API_KEY" >&2; exit 1; }
      GOOGLE_MAPS_MAP_ID="${VITE_GOOGLE_MAPS_MAP_ID:-DEMO_MAP_ID}"
      case "$VITE_GOOGLE_MAPS_API_KEY:$GOOGLE_MAPS_MAP_ID" in
        *[!A-Za-z0-9_:-]*) echo "ERROR: configuración de Google Maps inválida" >&2; exit 1 ;;
      esac
      printf "window.__SAFEWALK_CONFIG__ = Object.assign(window.__SAFEWALK_CONFIG__ || {}, { googleMapsApiKey: '%s', googleMapsMapId: '%s' });\\n" "$VITE_GOOGLE_MAPS_API_KEY" "$GOOGLE_MAPS_MAP_ID" > /tmp/safewalk-map-config.js
      tar -czf /tmp/frontend.tar.gz -C frontend dist
    - scp /tmp/frontend.tar.gz safewalk-target:~/frontend.tar.gz
    - scp /tmp/safewalk-map-config.js safewalk-target:~/safewalk-map-config.js
    - scp safewalku.nginx safewalk-target:~/safewalku.nginx
    - |
      ssh safewalk-target '
        set -e
        sudo docker rm -f safewalk-frontend safewalkweb_container 2>/dev/null || true
        sudo systemctl stop apache2 2>/dev/null || true
        if ! command -v nginx >/dev/null 2>&1; then
          sudo apt-get update -y
          sudo apt-get install -y nginx
        fi
        rm -rf ~/frontend-release
        mkdir -p ~/frontend-release
        tar -xzf ~/frontend.tar.gz -C ~/frontend-release
        sudo mkdir -p /var/www/safewalku
        sudo mkdir -p /var/www/safewalku/dist/assets
        sudo cp -a ~/frontend-release/dist/assets/. /var/www/safewalku/dist/assets/
        sudo find ~/frontend-release/dist -mindepth 1 -maxdepth 1 ! -name assets -exec cp -a {} /var/www/safewalku/dist/ \;
        sudo install -o www-data -g www-data -m 644 ~/safewalk-map-config.js /var/www/safewalku/dist/map-config.js
        sudo find /var/www/safewalku/dist/assets -type f -mtime +14 -delete
        sudo chown -R www-data:www-data /var/www/safewalku
        sudo cp ~/safewalku.nginx /etc/nginx/sites-available/safewalku
        sudo ln -sf /etc/nginx/sites-available/safewalku /etc/nginx/sites-enabled/safewalku
        sudo rm -f /etc/nginx/sites-enabled/default
        for site in /etc/nginx/sites-enabled/*; do
          [ "$(readlink -f "$site")" = "/etc/nginx/sites-available/safewalku" ] && continue
          if sudo grep -Eq "server_name[[:space:]]+.*safewalku\\.online" "$site"; then
            echo "Deshabilitando configuracion Nginx duplicada: $site"
            sudo rm -f "$site"
          fi
        done
        sudo nginx -t
        sudo systemctl enable nginx
        sudo systemctl restart nginx
        rm -f ~/frontend.tar.gz ~/safewalku.nginx ~/safewalk-map-config.js
      '
    - ssh safewalk-target "curl --fail --silent --show-error http://127.0.0.1/api/health"
    - curl --fail --silent --show-error --retry 3 https://safewalku.online/api/health
  environment:
    name: frontend-production
    url: https://safewalku.online
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
